    <!-- ============================================================
         THE SOCIETY SEAL, as vector.

         The ring, its rules and all of its lettering are true vector,
         so they stay crisp at every size on the page. The emblem in
         the middle — the colon, palm and swords — is the artwork from
         the supplied file, clipped to the inner circle.

         Defined once here and referenced with <use> wherever the seal
         appears. It is inline rather than an external .svg file so
         that it inherits the page's webfonts.
         ============================================================ -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <linearGradient id="sealRing" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" />
          <stop offset="45%"  stop-color="#EEF2F7" />
          <stop offset="100%" stop-color="#DCE4EE" />
        </linearGradient>
        <clipPath id="sealCoreClip">
          <circle cx="256" cy="256" r="160" />
        </clipPath>

        <!-- Baseline arcs for the ring lettering -->
        <path id="sealArcTop"    d="M 49,256 A 207,207 0 0 1 463,256" fill="none" />
        <path id="sealArcBottom" d="M 58,256 A 198,198 0 0 0 454,256" fill="none" />

        <symbol id="sscrs-seal" viewBox="0 0 512 512">
          <circle cx="256" cy="256" r="250" fill="url(#sealRing)" />
          <circle cx="256" cy="256" r="250" fill="none" stroke="#C3CFDD" stroke-width="2" />
          <circle cx="256" cy="256" r="242" fill="none" stroke="#4E9E37" stroke-width="2.5" />
          <circle cx="256" cy="256" r="166" fill="none" stroke="#4E9E37" stroke-width="2.5" />
          <circle cx="256" cy="256" r="161" fill="none" stroke="#C3CFDD" stroke-width="2" />

          <image href="seal-core.png" x="96" y="96" width="320" height="320"
                 clip-path="url(#sealCoreClip)" />

          <g fill="#3C7A2A" font-weight="700">
            <text font-family="Noto Kufi Arabic, Segoe UI, Tahoma, sans-serif"
                  font-size="23" direction="rtl">
              <textPath href="#sealArcTop" startOffset="50%" text-anchor="middle"
                >الجمعية السعودية لجراحة القولون والمستقيم</textPath>
            </text>
            <text font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif"
                  font-size="20.5" letter-spacing="0.6">
              <textPath href="#sealArcBottom" startOffset="50%" text-anchor="middle"
                >SAUDI SOCIETY OF COLON &amp; RECTAL SURGERY</textPath>
            </text>
            <text x="52" y="266" text-anchor="middle"
                  font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="26">2009</text>
            <text x="460" y="266" text-anchor="middle"
                  font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="26">1430</text>
          </g>
        </symbol>
      </defs>
    </svg>
