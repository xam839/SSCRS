    <!-- GALLERY LIGHTBOX -->
    <div class="lightbox" data-lightbox role="dialog" aria-modal="true"
         aria-label="Image viewer" data-i18n-aria="a11y.viewer" hidden>
      <button class="lb-btn lb-close" type="button" data-lb-close
              aria-label="Close" data-i18n-aria="a11y.closeViewer">&times;</button>
      <button class="lb-btn lb-prev" type="button" data-lb-prev
              aria-label="Previous image" data-i18n-aria="a11y.prevImage"></button>
      <button class="lb-btn lb-next" type="button" data-lb-next
              aria-label="Next image" data-i18n-aria="a11y.nextImage"></button>
      <figure class="lb-stage">
        <img data-lb-img alt="" />
        <figcaption class="lb-meta">
          <span class="lb-cat" data-lb-cat></span>
          <span class="lb-cap" data-lb-cap></span>
          <span class="lb-count"><b data-lb-i></b> / <b data-lb-n></b></span>
        </figcaption>
      </figure>
    </div>
