<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | SSCRS</title>
    <style>
      :root {
        --blue:  #24599E;
        --green: #6CB261;
        --cream: #f1faee;
        --dark:  #14241a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--blue);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .code {
        font-size: clamp(5rem, 20vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        color: rgba(255,255,255,0.12);
      }
      h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
      p  { color: rgba(164,184,187,0.8); font-size: 1rem; max-width: 340px; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 13px 30px;
        background: var(--green);
        color: #fff;
        text-decoration: none;
        border-radius: 99px;
        font-weight: 600;
        font-size: 15px;
        transition: opacity 0.2s;
      }
      a:hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Back to Home</a>
    </div>
  </body>
</html>
