<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | SSCRS</title>
    <link rel="icon" type="image/png" href="/SSCRS/favicon.png" />
    <style>
      :root { --navy-900: #0C2549; --navy: #1B4C93; --green: #4E9E37; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #fff;
        color: #4B5663;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        line-height: 1.7;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; max-width: 460px; }
      img { width: 128px; height: 128px; margin-bottom: 32px; }
      .code {
        font-size: 12px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--green); margin-bottom: 14px;
      }
      h1 {
        font-size: 1.6rem; font-weight: 700; color: #16202C;
        letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 14px;
      }
      p { font-size: 1rem; margin-bottom: 32px; }
      a {
        display: inline-block; padding: 13px 30px; border-radius: 3px;
        background: var(--navy); color: #fff; text-decoration: none;
        font-weight: 600; font-size: 14px;
        transition: background-color 0.18s ease;
      }
      a:hover { background: #123A72; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Project-site path. If SSCRS moves to a custom domain, change
           these two /SSCRS/ paths to / -->
      <img src="/SSCRS/sscrs-seal.png" alt="Seal of the Saudi Society of Colon &amp; Rectal Surgery" />
      <p class="code">Error 404</p>
      <h1>This page could not be found</h1>
      <p>The page you are looking for does not exist, or has been moved to a new address.</p>
      <a href="/SSCRS/">Return to the homepage</a>
    </div>
  </body>
</html>
